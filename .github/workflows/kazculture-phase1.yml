name: KazCulture Phase 1 offline tests

on:
  push:
    branches:
      - experiment/kazculture-qwen3-phase1
  pull_request:
    paths:
      - 'src/loaders/kazculture_loader.py'
      - 'src/evaluation/kazculture_phase1.py'
      - 'src/evaluation/kazculture_hf_scorer_v2.py'
      - 'scripts/eval_kazculture_phase1_v2.py'
      - 'tests/test_kazculture_phase1_v2.py'
      - 'scripts/eval_kazculture_phase1.py'
      - 'tests/test_kazculture_phase1.py'
      - '.github/workflows/kazculture-phase1.yml'

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pydantic
      - name: Test KazCulture schema, leakage guards and scoring
        run: python -m pytest -q tests/test_kazculture_phase1.py tests/test_kazculture_phase1_v2.py
      - name: Compile Phase 1 files
        run: python -m compileall -q src/loaders/kazculture_loader.py src/evaluation/kazculture_phase1.py src/evaluation/kazculture_hf_scorer.py src/evaluation/kazculture_hf_scorer_v2.py scripts/eval_kazculture_phase1.py scripts/eval_kazculture_phase1_v2.py scripts/stage_kazculture_phase1.py
