name: KazCulture Phase 1 offline tests

on:
  push:
    branches:
      - experiment/kazculture-qwen3-phase1
  pull_request:
    paths:
      - 'src/loaders/kazculture_loader.py'
      - 'src/evaluation/kazculture_phase1.py'
      - 'src/evaluation/kazculture_hf_scorer_v2.py'
      - 'scripts/eval_kazculture_phase1_v2.py'
      - 'tests/test_kazculture_phase1_v2.py'
      - 'src/loaders/kazculture_corpus.py'
      - 'src/construction/kazculture_kg.py'
      - 'src/retrieval/kazculture_index.py'
      - 'src/evaluation/kazculture_rag.py'
      - 'tests/test_kazculture_pipeline.py'
      - 'scripts/eval_kazculture_phase1.py'
      - 'tests/test_kazculture_phase1.py'
      - '.github/workflows/kazculture-phase1.yml'

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pydantic numpy scipy scikit-learn networkx
      - name: Test KazCulture schema, leakage guards and scoring
        run: python -m pytest -q tests/test_kazculture_phase1.py tests/test_kazculture_phase1_v2.py tests/test_kazculture_pipeline.py
      - name: Smoke test V2 CLI parser without dataset or GPU
        run: python scripts/eval_kazculture_phase1_v2.py --help
      - name: Smoke test all Phase 2-5 CLIs without dataset or GPU
        run: |
          python scripts/prepare_kazculture_corpus.py --help
          python scripts/extract_kazculture_kg.py --help
          python scripts/build_kazculture_index.py --help
          python scripts/tune_kazculture_retrieval.py --help
          python scripts/eval_kazculture_retrieval.py --help
          python scripts/compare_kazculture_runs.py --help
      - name: Compile Phase 1 files
        run: python -m compileall -q src/loaders/kazculture_loader.py src/evaluation/kazculture_phase1.py src/evaluation/kazculture_hf_scorer.py src/evaluation/kazculture_hf_scorer_v2.py scripts/eval_kazculture_phase1.py scripts/eval_kazculture_phase1_v2.py scripts/stage_kazculture_phase1.py scripts/prepare_kazculture_corpus.py scripts/extract_kazculture_kg.py scripts/build_kazculture_index.py scripts/tune_kazculture_retrieval.py scripts/eval_kazculture_retrieval.py
