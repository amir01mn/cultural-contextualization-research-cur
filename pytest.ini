[pytest]
# Restrict collection to the test suite.
#
# Without this, a bare `pytest` walks the whole project root: `.venv/` (300+
# installed packages) and `data/processed/llm_cache*/` (tens of thousands of
# cached LLM responses). On a Lustre filesystem that metadata walk dominates
# everything else - collection alone ran past 40 minutes and never reached a
# test, while `pytest tests/test_x.py` finished in under a second.
testpaths = tests

norecursedirs =
    .venv
    .git
    data
    slurm
    lib
    docs
    __pycache__
    *.egg-info

# Offline, deterministic defaults are set in tests/conftest.py (an `env` block
# here would need the pytest-env plugin and is silently ignored without it).

addopts = -q
